quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.database.generation=none
quarkus.datasource.jdbc.url=${QUARKUS_DB}
quarkus.datasource.username=${QUARKUS_USER}
quarkus.datasource.password=${QUARKUS_PASSWORD}
quarkus.transaction-manager.default-transaction-timeout=300000
quarkus.datasource.jdbc.acquisition-timeout=300000
quarkus.datasource.jdbc.new-connection-sql=set datestyle='ISO, DMY'
quarkus.hibernate-orm.jdbc.timezone=America/Sao_Paulo
quarkus.banner.path=banner.txt

quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=*